<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliHabit Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d1a;
            min-height: 100vh;
            padding-bottom: 80px;
            color: #e8e8e8;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            box-shadow: 0 -2px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #555;
            font-size: 0.7em;
            padding: 5px 8px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .nav-item:hover {
            color: #6c63ff;
        }
        
        .nav-item.active {
            color: #6c63ff;
        }
        
        .nav-icon {
            font-size: 1.3em;
            margin-bottom: 2px;
        }
        
        .nav-label {
            font-size: 0.65em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .content {
            background: #16162e;
            padding: 30px;
            border-radius: 16px;
            min-height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .alert {
            padding: 12px 20px;
            margin: 10px 0;
            background: #2a1a3e;
            color: #c084fc;
            border-radius: 8px;
            border: 1px solid rgba(192, 132, 252, 0.2);
        }
        
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn:hover {
            background: #5a52d5;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.3);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.05);
            color: #e8e8e8;
            transition: all 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6c63ff;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.1);
            background: rgba(255, 255, 255, 0.08);
        }
        
        input::placeholder, textarea::placeholder {
            color: #555;
        }
        
        label {
            font-weight: 500;
            color: #aaa;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0d0d1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #6c63ff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
    }
    
    document.querySelectorAll('.nav-item').forEach(item => {
        if (item.getAttribute('href') === window.location.pathname) {
            item.classList.add('active');
        }
    });
</script>

</body>
</html>
