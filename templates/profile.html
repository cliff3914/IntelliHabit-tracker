{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <div class="profile-header">
        <div class="profile-avatar">👤</div>
        <h1>{{ current_user.username }}</h1>
        <p>{{ current_user.email }}</p>
    </div>
    
    <div class="profile-stats">
        <div class="stat-card">
            <div class="stat-value">{{ total_habits }}</div>
            <div class="stat-label">Total Habits</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">{{ total_streak }}</div>
            <div class="stat-label">Total Streak</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">{{ completed_today }}</div>
            <div class="stat-label">Completed Today</div>
        </div>
    </div>
    
    <div class="profile-menu">
        <a href="/settings" class="menu-item">
            <span>⚙️ Settings</span>
            <span>→</span>
        </a>
        <a href="/friends" class="menu-item">
            <span>👥 Friends</span>
            <span>→</span>
        </a>
        <a href="/report" class="menu-item">
            <span>📊 My Report</span>
            <span>→</span>
        </a>
        <a href="/logout" class="menu-item logout">
            <span>🚪 Logout</span>
            <span>→</span>
        </a>
    </div>
</div>

<style>
.profile-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

.profile-header {
    text-align: center;
    margin-bottom: 30px;
}

.profile-avatar {
    font-size: 4em;
    background: #667eea;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    color: white;
}

.profile-header h1 {
    margin: 0 0 5px 0;
}

.profile-header p {
    color: #666;
    margin: 0;
}

.profile-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.stat-value {
    font-size: 1.8em;
    font-weight: bold;
    color: #667eea;
}

.stat-label {
    font-size: 0.8em;
    color: #666;
}

.profile-menu {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: #333;
    transition: background 0.2s;
}

.menu-item:hover {
    background: #f5f5f5;
}

.menu-item.logout {
    color: #ff4444;
}

body.dark-mode .stat-card,
body.dark-mode .profile-menu {
    background: #1a1a2e;
}

body.dark-mode .menu-item {
    color: #eee;
    border-bottom-color: #2a2a3e;
}

body.dark-mode .menu-item:hover {
    background: #2a2a3e;
}

body.dark-mode .profile-header p {
    color: #aaa;
}
</style>
{% endblock %}
