{% extends "base.html" %}

{% block content %}
<div class="timer-container">
    <h1>🧘 Focus Timer</h1>
    <p>With natural sounds</p>
    
    <div class="timer-card">
        <div class="meditation-icon">🧘</div>
        <div class="timer-display">
            <span id="minutes">30</span>:<span id="seconds">00</span>
        </div>
        
        <div class="preset-times">
            <button class="preset-btn" onclick="setTime(5)">5 min</button>
            <button class="preset-btn" onclick="setTime(15)">15 min</button>
            <button class="preset-btn active" onclick="setTime(30)">30 min</button>
            <button class="preset-btn" onclick="setTime(60)">60 min</button>
        </div>
        
        <div class="timer-controls">
            <button class="timer-btn" id="startBtn" onclick="startTimer()">▶ Start</button>
            <button class="timer-btn" id="pauseBtn" onclick="pauseTimer()" style="display:none;">⏸ Pause</button>
            <button class="timer-btn" onclick="resetTimer()">🔄 Reset</button>
        </div>
        
        <div class="sound-section">
            <h3>🎵 Focus Sound</h3>
            <div class="sound-grid">
                <button class="sound-btn" data-sound="silent">🔇 Silent</button>
                <button class="sound-btn" data-sound="tick">⏰ Tick</button>
                <button class="sound-btn" data-sound="cafe">☕ Cafe</button>
                <button class="sound-btn" data-sound="forest">🌲 Forest</button>
                <button class="sound-btn" data-sound="ocean">🌊 Ocean</button>
                <button class="sound-btn" data-sound="fire">🔥 Fire</button>
                <button class="sound-btn" data-sound="rain">🌧️ Rain</button>
                <button class="sound-btn" data-sound="storm">⛈️ Storm</button>
                <button class="sound-btn" data-sound="water">💧 Water</button>
            </div>
        </div>
        
        <div class="timer-stats">
            <div class="stat">
                <span class="stat-value" id="sessionsCount">0</span>
                <span class="stat-label">Sessions</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="totalMinutes">0</span>
                <span class="stat-label">Total Minutes</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="bestStreak">0</span>
                <span class="stat-label">Best Streak</span>
            </div>
        </div>
    </div>
</div>

<style>
.timer-container {
    text-align: center;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}

.timer-container h1 {
    color: #667eea;
    margin-bottom: 5px;
}

.timer-card {
    background: white;
    border-radius: 30px;
    padding: 30px;
    margin-top: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}

.meditation-icon {
    font-size: 3em;
    margin-bottom: 20px;
}

.timer-display {
    font-size: 4.5em;
    font-weight: bold;
    font-family: monospace;
    color: #333;
    margin: 20px 0;
}

.preset-times {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.preset-btn {
    padding: 8px 20px;
    border: none;
    background: #f0f0f0;
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.9em;
    transition: all 0.3s;
}

.preset-btn.active {
    background: #667eea;
    color: white;
}

.preset-btn:hover {
    transform: scale(1.05);
}

.timer-controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
}

.timer-btn {
    padding: 12px 30px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1.1em;
    transition: all 0.3s;
}

.timer-btn:hover {
    transform: scale(1.05);
    background: #45a049;
}

.sound-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.sound-section h3 {
    margin-bottom: 15px;
    color: #555;
}

.sound-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.sound-btn {
    padding: 10px 5px;
    border: none;
    background: #f0f0f0;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.9em;
    transition: all 0.2s;
}

.sound-btn.active {
    background: #667eea;
    color: white;
}

.sound-btn:hover {
    transform: scale(1.02);
    background: #ddd;
}

.timer-stats {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #eee;
}

.stat {
    text-align: center;
}

.stat-value {
    display: block;
    font-size: 1.8em;
    font-weight: bold;
    color: #667eea;
}

.stat-label {
    font-size: 0.8em;
    color: #888;
}

body.dark-mode .timer-card {
    background: #1a1a2e;
}

body.dark-mode .timer-display {
    color: #eee;
}

body.dark-mode .preset-btn {
    background: #333;
    color: #eee;
}

body.dark-mode .sound-btn {
    background: #333;
    color: #eee;
}

body.dark-mode .sound-section h3 {
    color: #aaa;
}

@media (max-width: 768px) {
    .timer-display {
        font-size: 3em;
    }
    .preset-btn {
        padding: 6px 15px;
        font-size: 0.8em;
    }
    .timer-btn {
        padding: 10px 20px;
    }
    .sound-grid {
        grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
    }
    .sound-btn {
        font-size: 0.7em;
        padding: 8px 5px;
    }
}
</style>

<script>
// Timer variables
let timerInterval;
let timeLeft = 30 * 60;
let isRunning = false;
let currentSound = 'silent';
let sessionsCompleted = parseInt(localStorage.getItem('focusSessions') || 0);
let totalMinutes = parseInt(localStorage.getItem('focusMinutes') || 0);
let bestStreak = parseInt(localStorage.getItem('focusBestStreak') || 0);
let currentStreak = 0;

// Load stats on page load
document.addEventListener('DOMContentLoaded', function() {
    updateStatsDisplay();
});

function updateDisplay() {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    document.getElementById('minutes').textContent = mins.toString().padStart(2, '0');
    document.getElementById('seconds').textContent = secs.toString().padStart(2, '0');
}

function setTime(minutes) {
    if (isRunning) {
        pauseTimer();
    }
    timeLeft = minutes * 60;
    updateDisplay();
    
    // Update active button style
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.includes(minutes)) {
            btn.classList.add('active');
        }
    });
}

function startTimer() {
    if (isRunning) return;
    
    // Check if timer is already at 0
    if (timeLeft <= 0) {
        setTime(30);
    }
    
    isRunning = true;
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'inline-block';
    
    timerInterval = setInterval(() => {
        if (timeLeft <= 1) {
            completeTimer();
        } else {
            timeLeft--;
            updateDisplay();
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('pauseBtn').style.display = 'none';
}

function resetTimer() {
    pauseTimer();
    // Reset to current preset time
    const activePreset = document.querySelector('.preset-btn.active');
    if (activePreset) {
        const minutes = parseInt(activePreset.textContent);
        timeLeft = minutes * 60;
    } else {
        timeLeft = 30 * 60;
    }
    updateDisplay();
}

function completeTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    
    // Play completion sound (simple beep using Audio API)
    try {
        // Create a simple beep using Web Audio
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = 880;
        gainNode.gain.value = 0.3;
        oscillator.start();
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 1);
        oscillator.stop(audioContext.currentTime + 1);
    } catch(e) { console.log('Audio not supported'); }
    
    // Show completion message
    alert("🎉 Time's up! Great job! 🎉");
    
    // Update stats
    const completedMinutes = parseInt(document.querySelector('.preset-btn.active').textContent) || 30;
    sessionsCompleted++;
    totalMinutes += completedMinutes;
    currentStreak++;
    
    if (currentStreak > bestStreak) {
        bestStreak = currentStreak;
    }
    
    // Save to localStorage
    localStorage.setItem('focusSessions', sessionsCompleted);
    localStorage.setItem('focusMinutes', totalMinutes);
    localStorage.setItem('focusBestStreak', bestStreak);
    
    updateStatsDisplay();
    
    // Reset timer
    setTime(parseInt(document.querySelector('.preset-btn.active').textContent) || 30);
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('pauseBtn').style.display = 'none';
}

function updateStatsDisplay() {
    document.getElementById('sessionsCount').textContent = sessionsCompleted;
    document.getElementById('totalMinutes').textContent = totalMinutes;
    document.getElementById('bestStreak').textContent = bestStreak;
}

// Sound effects (simulated using Audio API)
function playSound(soundName) {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const gainNode = audioContext.createGain();
        gainNode.connect(audioContext.destination);
        gainNode.gain.value = 0.1;
        
        if (soundName === 'tick') {
            const oscillator = audioContext.createOscillator();
            oscillator.connect(gainNode);
            oscillator.frequency.value = 1000;
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.1);
        } else if (soundName === 'water') {
            // White noise for water sound
            const bufferSize = 4096;
            const noiseNode = audioContext.createScriptProcessor(bufferSize, 1, 1);
            noiseNode.connect(gainNode);
            noiseNode.onaudioprocess = function(e) {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 0.2;
                }
            };
            noiseNode.start();
            setTimeout(() => noiseNode.stop(), 2000);
        }
    } catch(e) { console.log('Sound not supported'); }
}

// Sound button selection
document.querySelectorAll('.sound-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.sound-btn').forEach(b => {
            b.classList.remove('active');
            b.style.background = '';
        });
        btn.classList.add('active');
        btn.style.background = '#667eea';
        btn.style.color = 'white';
        currentSound = btn.dataset.sound;
        playSound(currentSound);
    });
});

// Set initial active sound
document.querySelector('.sound-btn[data-sound="silent"]').classList.add('active');
</script>
{% endblock %}
