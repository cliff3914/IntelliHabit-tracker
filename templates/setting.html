{% extends "base.html" %}

{% block content %}
<h1>⚙️ Settings</h1>

<form method="post">
    <div class="form-group">
        <label>
            <input type="checkbox" name="email_notifications" {% if current_user.email_notifications %}checked{% endif %}>
            📧 Email Notifications
        </label>
    </div>
    
    <div class="form-group">
        <label>
            <input type="checkbox" name="sms_notifications" {% if current_user.sms_notifications %}checked{% endif %}>
            📱 SMS Notifications
        </label>
    </div>
    
    <div class="form-group">
        <label>📞 Phone Number (for SMS):</label>
        <input type="tel" name="phone_number" value="{{ current_user.phone_number or '' }}" placeholder="+1234567890">
    </div>
    
    <button type="submit" class="btn">Save Settings</button>
</form>

<div style="margin-top: 30px;">
    <h3>🔔 Push Notifications</h3>
    <button onclick="requestNotificationPermission()" class="btn">Enable Notifications</button>
    <p id="notifyStatus"></p>
</div>

<script>
function requestNotificationPermission() {
    if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                document.getElementById('notifyStatus').innerHTML = '✅ Notifications enabled!';
            } else {
                document.getElementById('notifyStatus').innerHTML = '❌ Notifications blocked';
            }
        });
    }
}

if ('Notification' in window && Notification.permission === 'granted') {
    document.getElementById('notifyStatus').innerHTML = '✅ Notifications are enabled';
}
</script>

<style>
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
}
.form-group input[type="tel"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
}
</style>
{% endblock %}
