services:
  - type: web
    name: intellihabit-tracker
    runtime: python
    repo: https://github.com/YOUR_USERNAME/intellihabit-tracker
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "IntelliHabit Tracker:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

